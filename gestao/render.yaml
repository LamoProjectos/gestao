services:
  - type: web
    name: lamo-gestao
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn gestao.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: DATABASE_URL
        value: postgresql://postgres.wlvlxlcepshwezgpvhep:akame2424.,@aws-0-eu-central-1.pooler.supabase.com:6543/postgres?sslmode=require
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
    preDeployCommand: python manage.py migrate && python manage.py setup_users
