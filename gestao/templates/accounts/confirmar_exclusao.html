{% extends 'base.html' %}
{% block title %}Confirmar{% endblock %}
{% block page_title %}Confirmar{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="form-card text-center">
            <i class="bi bi-exclamation-triangle text-danger" style="font-size:3rem;"></i>
            <h5 class="mt-3 mb-2">Desativar {{ user.username }}?</h5>
            <p class="text-muted mb-4">O utilizador perderá acesso ao sistema até ser reativado.</p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex gap-2 justify-content-center">
                    <button type="submit" class="btn btn-danger"><i class="bi bi-person-x me-1"></i> Sim, Desativar</button>
                    <a href="{% url 'accounts:lista_utilizadores' %}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
