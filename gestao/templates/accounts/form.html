{% extends 'base.html' %}
{% block title %}{{ titulo }}{% endblock %}
{% block page_title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="form-card">
            <form method="post">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Utilizador <span class="text-danger">*</span></label>
                        <input type="text" name="username" class="form-control" value="{{ user.username|default:'' }}" {% if user %}readonly{% endif %} required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Nome Completo</label>
                        <input type="text" name="first_name" class="form-control" value="{{ user.first_name|default:'' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" value="{{ user.email|default:'' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Senha{% if not user %} <span class="text-danger">*</span>{% endif %}</label>
                        <input type="password" name="password" class="form-control" {% if not user %}required{% endif %} placeholder="{% if user %}Deixar vazio para manter{% endif %}">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Grupos</label>
                        <div class="d-flex flex-wrap gap-3 mt-1">
                            {% for g in grupos %}
                            <div class="form-check">
                                <input type="checkbox" name="grupos" value="{{ g.id }}" class="form-check-input" id="grupo_{{ g.id }}"
                                    {% if user and g in user.groups.all %}checked{% endif %}>
                                <label class="form-check-label" for="grupo_{{ g.id }}">{{ g.name }}</label>
                            </div>
                            {% endfor %}
                        </div>
                    </div>
                    {% if user and user != request.user %}
                    <div class="col-12">
                        <div class="form-check">
                            <input type="checkbox" name="is_active" class="form-check-input" id="is_active" {% if user.is_active %}checked{% endif %}>
                            <label class="form-check-label" for="is_active">Utilizador ativo</label>
                        </div>
                    </div>
                    {% endif %}
                </div>
                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-accent"><i class="bi bi-check-lg me-1"></i> Salvar</button>
                    <a href="{% url 'accounts:lista_utilizadores' %}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
