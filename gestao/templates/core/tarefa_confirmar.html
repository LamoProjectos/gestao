{% extends 'base.html' %}
{% block title %}Excluir Tarefa{% endblock %}
{% block page_title %}Excluir Tarefa{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="form-card text-center">
            <i class="bi bi-exclamation-triangle text-danger display-4"></i>
            <h5 class="mt-3">Excluir tarefa "{{ tarefa.titulo }}"?</h5>
            <p class="text-muted">Esta ação não pode ser desfeita.</p>
            <form method="post" class="d-flex justify-content-center gap-2">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i> Excluir</button>
                <a href="{% url 'core:lista_tarefas' %}" class="btn btn-outline-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
